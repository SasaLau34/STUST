<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Text Shadow Example</title>
    <style>
        h3 {
            margin: 10px;
            font-size: 28px;
        }

        .shadow1 {
            text-shadow: red 4px 4px 6px;
        }

  
        .shadow2 {
            text-shadow: green 2px 2px 4px;
        }

       
        .shadow3 {
            text-shadow: #ad4444 1px 1px 2px;
        }

        .shadow4 {
            text-shadow: 0 0 10px lightblue;
        }

        
        .shadow5 {
            text-shadow: 2px 2px 2px blue, 4px 4px 6px black;
        }
    </style>
</head>
<body>

    <h3 class="shadow1">Indonesia</h3>
    <h3 class="shadow2">Malaysia</h3>
    <h3 class="shadow3">Singapore</h3>
    <h3 class="shadow4">Thailand</h3>
    <h3 class="shadow5">Taiwan</h3>

</body>
</html>
