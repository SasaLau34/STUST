<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>\我喜欢的偶像</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: white;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            margin-top: 20px;
        }

        .left {
            width: 30%;
            background-color: #add8e6;
            padding: 10px;
            text-align: center;
        }

            .left img {
                max-width: 100%;
                border: 2px solid black;
            }

            .left .name {
                font-weight: bold;
                margin-top: 10px;
            }

        .right {
            width: 70%;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding-left: 20px;
        }

        .box {
            padding: 10px;
            color: black;
            border-radius: 5px;
            width: 30%;
        }

        .light-purple {
            background-color: #e6ccff;
            color: #6a5acd; 
        }

        .milk-tea {
            background-color: #f5e0c7;
            color: #8b4513; 
        }

        .light-yellow {
            background-color: #fffacd;
            color: #ff1493; 
        }

        .section-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .quote {
            font-style: italic;
            color: #6a5acd;
            text-decoration: underline;
        }

        .song {
            font-weight: bold;
            font-size: 1.2em;
            letter-spacing: 2px;
        }

        .idol {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <h1>他们是谁呢？</h1>

    <div class="container">
        <div class="left">
            <img src="https://media.zenfs.com/ko/mnews_tw_258/342a84ddcdcd87ca861d32bbbcc234bf" alt="TFBOYS">
            <div class="name">TFBOYS</div>
        </div>
        <div class="right">
            <div class="box light-purple">
                <div class="section-title">TFBOYS 语录</div>
                <div>
                    <p class="quote">1.一人独行，两人并肩，三人陪伴。十年一梦，陪伴是最长情的告白。</p>
                    <p class="quote">2.柠檬不会不酸，苦瓜不会不苦，薄荷不会不凉，地球不会不转，四叶草不会不爱TFBOYS.</p>
                </div>
            </div>
            <div class="box milk-tea">
                <div class="section-title">我最喜歡的歌</div>
                <div>
                    <p class="song">青春修煉手冊</p>
                    <p class="song">寵愛</p>
                    <p class="song">大夢想家</p>
                    <p class="song">不完美小孩</p>
                    <p class="song">樣</p>
                    <p class="song">剩下的盛夏</p>
                    <p class="song">魔法城堡</p>
                    <p class="song">是你</p>
                </div>
            </div>
            <div class="box light-yellow">
                <div class="section-title">我最喜欢的偶像</div>
                <div>
                    <p class="idol">-王俊凯</p>
                    <p class="idol">-王源</p>
                    <p class="idol">-易烊千玺</p>
                    <p class="idol">-林一</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
